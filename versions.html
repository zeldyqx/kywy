<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kywy | All Versions</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 40px;
            margin: 0;
            min-height: 100vh;
        }

        .wrapper {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .header {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-bottom: 30px;
        }
        .header h1 { 
            font-size: 3rem; 
            margin: 0 0 5px 0; 
            color: #84d634; 
        }

        .container { 
            display: flex; 
            flex-direction: column; 
            align-items: flex-start; 
            gap: 10px; 
            margin-top: 10px; 
            width: 100%; 
        }
        
        .btn {
            padding: 12px 24px;
            background-color: #333;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 50px;
            transition: transform 0.2s, background 0.3s;
            text-align: center;
            display: inline-block;
            font-size: 0.95rem;
        }
        .btn:hover { background-color: #444; transform: scale(1.02); }

        .btn-back {
            background-color: #84d634;
            color: #000;
            margin-bottom: 20px;
        }
        .btn-back:hover { background-color: #a3e660; }
    </style>
</head>
<body>

    <div class="wrapper">
        <a href="index.html" class="btn btn-back">← Back to Home</a>

        <div class="header">
            <h1>All Versions</h1>
            <p style="color: #888; margin: 0;">Archive of all released versions of Kywy AutoClicker.</p>
        </div>

        <div class="container">
            <a href="https://mega.nz/file/7e42xSBL#Rg76vTc0RQxtPREneljCJEa4lrZZE4NI9nfq6f9qYxQ" class="btn">Pre-Release v0.1.1</a>
            <a href="https://drive.google.com/file/d/1fwkvG9K0EqyOXh_h454W5bBlYTtvOUXk/view?usp=drive_link" class="btn">Pre-Release v0.1.0</a>
            <a href="https://drive.google.com/file/d/1xA6tWn8qbxMZz6F44rnoDMKytEHPopvM/view?usp=drive_link" class="btn">alpha 0.0.4</a>

        </div>
    </div>
