<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Kywy AutoClicker</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --btn-bg: #2a2a2a;
            --btn-hover: #3a3a3a;
            --btn-text: #ffffff;
            --accent: #007acc;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: var(--panel-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            width: 350px;
            text-align: center;
        }

        .top-bar-fixed {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .social-btn {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            transition: background-color 0.2s, transform 0.1s;
        }

        .social-btn:hover {
            background-color: var(--btn-hover);
            transform: scale(1.02);
        }

        .social-icon {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .app-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: #b0b0b0;
        }

        .input-group input {
            width: 100%;
            background-color: var(--bg-color);
            border: 1px solid #333;
            border-radius: 6px;
            padding: 10px;
            color: var(--text-color);
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--accent);
        }

        .action-btn {
            width: 100%;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .action-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar-fixed">
            <a href="https://www.youtube.com/@KywyAutoClicker" target="_blank" class="social-btn">
                <svg class="social-icon" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></path></svg>
                YouTube
            </a>
        </div>

        <div class="app-title">Kywy AutoClicker</div>

        <div class="input-group">
            <label for="interval">Интервал кликов (мс)</label>
            <input type="text" id="interval" value="50">
        </div>

        <div class="input-group">
            <label for="hotkey">Горячая клавиша</label>
            <input type="text" id="hotkey" value="F6">
        </div>

        <button class="action-btn">Старт (F6)</button>
    </div>

</body>
</html>
