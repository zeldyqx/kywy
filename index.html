<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="kywy.png">
    <title>Kywy | AutoClicker</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #ffffff;
            --text-muted: #888;
            --text-desc: #ccc;
            --text-guide: #aaa;
            --accent-color: #84d634;
            --accent-hover: #a3e660;
            --accent-text: #000;
            --border-color: #333;
            --card-bg: #1a1a1a;
            --guide-bg: #161616;
            --btn-bg: #333;
            --btn-hover: #444;
            --btn-text: #fff;
        }

        [data-theme="light"] {
            --bg-color: #f4f4f4;
            --text-color: #121212;
            --text-muted: #666;
            --text-desc: #444;
            --text-guide: #555;
            --accent-color: #5ab211;
            --accent-hover: #48930d;
            --accent-text: #fff;
            --border-color: #ddd;
            --card-bg: #ffffff;
            --guide-bg: #f9f9f9;
            --btn-bg: #e0e0e0;
            --btn-hover: #d0d0d0;
            --btn-text: #121212;
        }

        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Segoe UI', sans-serif; padding: 40px; margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .wrapper { width: 100%; max-width: 800px; }

        .top-bar { display: flex; justify-content: flex-end; gap: 12px; margin-bottom: 40px; }
        .social-btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; background-color: var(--btn-bg); color: var(--btn-text); text-decoration: none; font-weight: bold; border-radius: 50px; border: 1px solid var(--border-color); }
        .social-icon { width: 18px; height: 18px; }

        .btn { padding: 15px 30px; background-color: var(--accent-color); color: var(--accent-text); font-weight: bold; border-radius: 50px; border: none; cursor: pointer; display: inline-block; text-decoration: none; transition: transform 0.2s; }
        .btn:hover { transform: scale(1.05); }
        
        /* Исправление ссылки в гайде */
        .guide-link { 
            color: var(--accent-color); 
            cursor: pointer; 
            text-decoration: underline;
            padding: 2px 6px;
            background: rgba(132, 214, 52, 0.1);
            border-radius: 4px;
        }
        .guide-link:hover { background: rgba(132, 214, 52, 0.2); }

        .description, .guide { width: 100%; background: var(--card-bg); padding: 22px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 20px; box-sizing: border-box; }
        .section-title { color: var(--text-muted); font-size: 1.1rem; margin-top: 30px; }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="top-bar">
            <a href="https://discord.gg/PDTmSxJ8R" class="social-btn">
                <svg class="social-icon" style="fill: #5865F2;" viewBox="0 0 24 24"><path d="M20.317 4.37c-4.885-1.515-10.37-1.515-15.26 0-.07.02-.13.06-.18.11a19.7 19.7 0 0 0-1.58 13.68c.03.11.08.2.16.27 1.83 1.34 3.75 2.27 5.75 2.85.08.02.16-.02.2-.09.34-.63.63-1.28.87-1.95.03-.09.02-.2-.04-.27-.85-.31-1.68-.69-2.48-1.12-.08-.04-.08-.15-.03-.2.03-.04.07-.06.12-.07 3.94 1.84 8.2 1.84 12.14 0 .05 0 .09.03.12.07.05.05.05.16-.03.2-.8.43-1.63.81-2.48 1.12-.06.02-.09.12-.06.2.23.66.52 1.32.87 1.95.03.07.1.11.18.09 2-0.58 3.92-1.51 5.75-2.85.08-.07.13-.16.16-.27a19.7 19.7 0 0 0-1.58-13.68c-.05-.05-.11-.09-.18-.11zM8.02 15.33c-1.18 0-2.16-1.09-2.16-2.42 0-1.33.96-2.42 2.16-2.42 1.21 0 2.18 1.09 2.18 2.42 0 1.33-.97 2.42-2.18 2.42zm7.98 0c-1.18 0-2.16-1.09-2.16-2.42 0-1.33.96-2.42 2.16-2.42 1.21 0 2.18 1.09 2.18 2.42 0 1.33-.97 2.42-2.18 2.42z"/></svg>
                Discord
            </a>
            <a href="https://www.youtube.com/@KywyAutoClicker" class="social-btn">
                <svg class="social-icon" style="fill: #ff0000;" viewBox="0 0 24 24"><path d="M23.5 6.2c-.1-1.3-1.2-2.3-2.5-2.4C17.3 3.5 12 3.5 12 3.5s-5.3 0-9 .3c-1.3.1-2.4 1.1-2.5 2.4-.2 2.3-.2 7.1-.2 7.1s0 4.8.2 7.1c.1 1.3 1.2 2.3 2.5 2.4 3.7.3 9 .3 9 .3s5.3 0 9-.3c1.3-.1 2.4-1.1 2.5-2.4.2-2.3.2-7.1.2-7.1s0-4.8-.2-7.1zM9.5 15.6V8.4l6.3 3.6-6.3 3.6z"/></svg>
                YouTube
            </a>
        </div>

        <h1>Kywy</h1>
        
        <a href="KywyAutoClicker.exe" class="btn" id="download-btn">Download Release 1.0.0</a>

        <div class="description">
            <strong>Kywy AutoClicker</strong> is an advanced, high-performance tool.
        </div>

        <h2 class="section-title">App Preview</h2>
        <div class="description">
            <img src="Screenshot 2026-07-31 020814.png" alt="Preview" style="width: 100%; border-radius: 8px;">
        </div>

        <div class="guide">
            <h2>How to Download</h2>
            <ol>
                <li>Click the <span class="guide-link" id="jump-to-download">"Download Release 1.0.0"</span> button above to save the file.</li>
            </ol>
        </div>
    </div>

    <script>
        const jumpLink = document.getElementById('jump-to-download');
        const mainDownloadBtn = document.getElementById('download-btn');
        jumpLink.addEventListener('click', () => {
            mainDownloadBtn.scrollIntoView({ behavior: 'smooth' });
            mainDownloadBtn.style.boxShadow = '0 0 20px var(--accent-color)';
            setTimeout(() => { mainDownloadBtn.style.boxShadow = 'none'; }, 1000);
        });
    </script>
</body>
</html>
